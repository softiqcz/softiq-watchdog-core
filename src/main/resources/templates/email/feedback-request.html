<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <title>SOFTIQ – krátká zpětná vazba</title>
  <style>
    body, table, td, p, a {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
      border-collapse: collapse;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #f0f4f2;
    }

    @media only screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
      }
    }
  </style>
</head>
<body style="background-color:#f0f4f2; margin:0; padding:0;">

<table border="0" cellpadding="0" cellspacing="0" style="background-color:#f0f4f2;" width="100%">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table border="0" cellpadding="0" cellspacing="0" class="email-container"
             style="max-width:600px; width:100%;" width="600">

        <tr>
          <td style="padding:0 4px 20px;">
            <span style="font-family:Arial,sans-serif; font-size:1.5rem; color:#1B4242; letter-spacing:-0.5px;">
              SOFTIQ
            </span>
          </td>
        </tr>

        <tr>
          <td style="background:#fff; border:1px solid #e8eeec; border-radius:12px; padding:28px 24px;">
            <p style="font-family:Arial,sans-serif; font-size:1rem; color:#1B4242; line-height:1.6; margin:0 0 14px;">
              Dobrý den,
            </p>
            <p style="font-family:Arial,sans-serif; font-size:0.95rem; color:#3a3a3a; line-height:1.65; margin:0 0 14px;">
              rádi bychom věděli, jak se vám softiq.cz používá a co bychom mohli zlepšit.
            </p>
            <table border="0" cellpadding="0" cellspacing="0">
              <tr>
                <td>
                  <a href="https://softiq.cz/#recenze"
                     style="background:#1B4242; color:#fff; font-family:Arial,sans-serif; font-size:0.9rem; font-weight:600; padding:12px 22px; border-radius:8px; display:inline-block; text-decoration:none;">
                    Napsat recenzi
                  </a>
                </td>
              </tr>
            </table>
            <p style="font-family:Arial,sans-serif; font-size:0.95rem; color:#3a3a3a; line-height:1.65; margin:22px 0 0;">
              Děkujeme za váš čas.<br/>Tým SOFTIQ
            </p>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:20px 12px 0;">
            <p style="font-family:Arial,sans-serif; font-size:0.75rem; color:#6f817b; line-height:1.6; margin:0;">
              <a href="https://softiq.cz" style="color:#1B4242; text-decoration:none;">softiq.cz</a>
              &nbsp;·&nbsp;
              <a href="mailto:info@softiq.cz" style="color:#1B4242; text-decoration:none;">info@softiq.cz</a>
              &nbsp;·&nbsp;
              <a th:href="${unsubscribeUrl}" style="color:#6f817b; text-decoration:underline;">Odhlásit odběr</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
