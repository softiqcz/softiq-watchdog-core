<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <style>
        body { background-color: #f0f4f2; font-family: Arial, sans-serif; padding: 32px 16px; color: #1a1a1a; }
        .email-wrapper { max-width: 600px; margin: auto; }
        .header { padding: 0 4px 24px; }
        .brand-name { font-size: 28px; color: #1B4242; line-height: 1; }
        .brand-sub { font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7DA596; }
        .content-card { background: #fff; border-radius: 12px; border: 1px solid #e8eeec; padding: 24px; }
        .detail-list { border: 1px solid #e8eeec; border-radius: 8px; overflow: hidden; margin-top: 12px; }
        .detail-row { display: grid; grid-template-columns: 130px 1fr; border-bottom: 1px solid #e8eeec; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { background-color: #f0f4f2; color: #7DA596; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 12px 14px; }
        .detail-value { color: #1B4242; font-size: 15px; line-height: 1.5; padding: 12px 14px; word-break: break-word; }
        .message-block { background-color: #eaf4f0; border-left: 3px solid #1B4242; border-radius: 0 8px 8px 0; padding: 14px 20px; margin-top: 12px; }
        .message-block p { font-size: 15px; color: #1B4242; line-height: 1.65; margin: 0; white-space: pre-line; }
        .muted-label { color: #7a8782; font-size: 12px; line-height: 1.5; margin: 18px 0 8px; }
        @media (max-width: 480px) { body { padding: 16px 10px; } .detail-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="email-wrapper">
    <div class="header">
        <div class="brand-name">SOFTIQ</div>
        <div class="brand-sub">Nová recenze</div>
    </div>

    <div class="content-card">
        <p>Na webu byla odeslána nová recenze.</p>

        <div class="detail-list">
            <div class="detail-row">
                <div class="detail-label">Jméno</div>
                <div class="detail-value" th:text="${reviewRequest.name}">Jan Novak</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Hodnocení</div>
                <div class="detail-value" th:text="${reviewRequest.stars + '/5'}">5/5</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Odesláno</div>
                <div class="detail-value" th:text="${reviewRequest.formattedTimestamp}">10.7.2026 14:35:00</div>
            </div>
        </div>

        <p class="muted-label">Text recenze</p>
        <div class="message-block">
            <p th:text="${reviewRequest.review}">Skvela spoluprace.</p>
        </div>
    </div>
</div>
</body>
</html>
